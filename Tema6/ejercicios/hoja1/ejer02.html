<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>

<body>
    <h1>Ejercicio 2: calcular el mayor de dos números</h1>

    <script>
        
        'use strict'

        let num1 = Number(prompt('Dime un número:'));
        let num2 = Number(prompt('Dime otro número:'));

        let mayor;

        if (num1 > num2) {
            mayor = num1;
        } else {
            mayor = num2;
        }

        console.log('El mayor de tus dos números es ' + mayor);

    </script>
</body>

</html>
