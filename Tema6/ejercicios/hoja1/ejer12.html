<body>
    <h1>12.- Escribe un programa que calcule el factorial de un número. El programa debe permitir calcular
        el factorial de todos los números que el usuario desee.
    </h1>

    <script>
        "use strict"

        let num = Number(prompt("Introduce un número y te dare su factorial"));

        let factorial = 1;

        for (let i = 2; i <= num; i++) {
            factorial *= i;
        }

        console.log(factorial);

    </script>

</body>
