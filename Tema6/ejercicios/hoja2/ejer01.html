<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 01</title>

    <style>
        #foto {
            border: solid green;
        }
    </style>

</head>

<body>

    <h1>Galeria</h1>

    <p>Pulsa sobre la imagen y la foto cambiara</p>

    <img id="foto" src="imgs/hamsters/w150px/hamster01.png" alt="hamster">
    <script>
        "use strict"

        document.querySelector("#foto").addEventListener("click", cambiarFoto);

        function cambiarFoto() {
            let foto = document.querySelector("img");

            let num = Math.floor((Math.random() * 12) + 1);

            if (num >= 10) {
                foto.src = "imgs/hamsters/w150px/hamster" + num + ".png";
            } else {
                foto.src = "imgs/hamsters/w150px/hamster0" + num + ".png";
            }
        }

    </script>

</body>

</html>
