<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Guardian News</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="contenedor">
        <h1>Noticias de The Guardian</h1>
    </div>

    <script>
        'use strict'

        let tema = 'iran';

        descargarArticulos();

        function descargarArticulos() {

            let url = 'https://content.guardianapis.com/search?q=' + tema + '&show-fields=all&api-key=ed355bd1-1049-444d-944c-b9612f1d2301';

            fetch(url)
                .then(res => res.json())
                .then(
                    res => {
                        listarTitulares(res);
                    }
                )
                .catch(error => console.log("Error accediendo a los datos."));

        }

        // Muestra en la consola los titulares y subtítulos de diez artículos.
        function listarTitulares(res) {

            for (let articulo of res.response.results) {

                console.log('--- ARTÍCULO ---');

                console.log(articulo.webUrl);
                console.log(articulo.webTitle);
                console.log(articulo.fields.trailText);

            }

        }

    </script>

</body>

</html>
