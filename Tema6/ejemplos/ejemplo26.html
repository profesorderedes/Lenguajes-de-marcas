<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 26</title>
</head>

<body>
    <h1>Openweathermap</h1>

    

    <img src="https://openweathermap.org/payload/api/media/file/02d@2x.png" alt="Estado del cielo">

    <script>
        'use strict'

        let url = "http://api.openweathermap.org/data/2.5/forecast?q=Palma&appid=7dcc6bb908fc23a49ee9184422cc7cfd";

        fetch(url)
            .then(
                res => res.json()
            )
            .then(
                res => {
                    let ciudad = res.city.name;
                    console.log("Ciudad: " + ciudad);

                    let poblacion = res.city.population;
                    console.log("Población: " + poblacion + " habitantes");

                    let orto = epoch(res.city.sunrise);
                    console.log("Salida del Sol: " + orto);

                    let ocaso = epoch(res.city.sunset);
                    console.log("Puesta del Sol: " + ocaso);

                    let hora = epoch(res.list[0].dt);
                    console.log("Hora de la previsión: " + hora);

                    let temperatura = res.list[0].main.temp - 273.15;
                    console.log("Temperatura: " + temperatura.toFixed(1) + "ºC");

                    let temperaturaMin = res.list[0].main.temp_min - 273.15;
                    console.log("Temperatura mínima (en las próximas tres horas): " + temperaturaMin.toFixed(1) + "ºC");

                    let temperaturaMax = res.list[0].main.temp_max - 273.15;
                    console.log("Temperatura máxima (en las próximas tres horas): " + temperaturaMax.toFixed(1) + "ºC");

                    let humedad = res.list[0].main.humidity;
                    console.log("Humedad: " + humedad + "%");

                    let presion = res.list[0].main.pressure;
                    console.log("Presión: " + presion + " mbar");

                    let velViento = res.list[0].wind.speed * 3600 / 1000;
                    console.log("Velocidad del viento: " + velViento.toFixed(1) + " km/h");

                    let rafagas = res.list[0].wind.gust * 3600 / 1000;
                    console.log("Ráfagas de viento de hasta " + rafagas.toFixed(1) + " km/h");

                    let dirViento = res.list[0].wind.deg;
                    console.log("Dirección del viento: " + dirViento + "º" + " (" + nombreViento(dirViento) + ")");






                }
            )
            .catch(
                error => console.log('Error descargando los datos.')
            );

        function epoch(tiempo) {
            let tiempoNormal = new Date(tiempo * 1000);

            let minutos = (tiempoNormal.getMinutes() < 10) ? "0" + tiempoNormal.getMinutes() : tiempoNormal.getMinutes();
            let segundos = (tiempoNormal.getSeconds() < 10) ? "0" + tiempoNormal.getSeconds() : tiempoNormal.getSeconds();

            return tiempoNormal.getHours() + ":" + minutos + ":" + segundos;
        }

        function nombreViento(grados) {

            // N(337.5º - 22.5º) NE(22.5º - 67.5º) E(67.5º - 112.5º) SE(112.5 - 157.5º) S(157.5º - 202.5º) 
            // SO(202.5º - 247.5) O(247.5 - 292.5º) NO(292.5 - 337.5)

            let direccion;
            if (grados >= 337.5 || grados < 22.5) {
                direccion = 'N';
            } else if (grados < 67.5) {
                direccion = 'NE';
            } else if (grados < 112.5) {
                direccion = 'E';
            } else if (grados < 157.5) {
                direccion = 'SE';
            } else if (grados < 202.5) {
                direccion = 'S';
            } else if (grados < 247.5) {
                direccion = 'SO';
            } else if (grados < 292.5) {
                direccion = 'O';
            } else if (grados < 337.5) {
                direccion = 'NO';
            }

            return direccion;

        }

    </script>
</body>

</html>
