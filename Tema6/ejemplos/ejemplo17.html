<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 17</title>
    <style>
        label,
        input {
            display: block;
        }

        input {
            margin-bottom: 7px;
        }
    </style>
</head>

<body>
    <h1>Eventos de foco</h1>

    <form action="">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre">
        <label for="password">Password</label>
        <input type="password" name="password" id="password">

        <input type="submit" value="Enviar">
    </form>

    <script>
        'use strict'

        let nombre = document.querySelector('#nombre');
        let password = document.querySelector('#password');

        nombre.addEventListener('focus', function () { fondoAmarillo(this) });
        password.addEventListener('focus', function () { fondoAmarillo(this) });

        nombre.addEventListener('focusout', function () { fondoBlanco(this) });
        password.addEventListener('focusout', function () { fondoBlanco(this) });

        function fondoAmarillo(elemento) {
            elemento.style.backgroundColor = 'yellow';
        }

        function fondoBlanco(elemento) {
            elemento.style.backgroundColor = 'white';
        }
    </script>
</body>

</html>
