        const coche = {
            matricula: "1234ABC",

        console.log(coche);

        console.log('Matrícula del coche: ' + coche.matricula);
        console.log('Modelo: ' + coche.marca + ' ' + coche.modelo);

        console.log('Matrícula del coche: ' + coche['matricula']);

        let ordenador = {
            procesador: 'Intel i7',
            ram: '32 GB',
            marca: 'HP',

            mostrar: function () {
                console.log(this.marca + ' con procesador ' + this.procesador + ' y ' + this.ram + ' de RAM.');

            getProcesador: function () {
                return this.procesador;

            }
        }

        ordenador.setProcesador('Intel i9');
        ordenador.mostrar();
        console.log("Procesador: " + ordenador.getProcesador());

        // Arrays

        let colores = ['Rojo', 'Ámbar', "Verde"];

        console.log('10 elevado a 5: ' + (10 ** 5));

        // Operadores de comparación

        let a = 10;
        let b = '10';

        console.log(a == b);
        console.log(a === b);

        console.log(a != b);
        console.log(a !== b);

        let palabra1 = 'coche';

        console.log(palabra1 < palabra2);

        }

        for (let i = 0; i < asistentes.length; i++) {
            console.log(asistentes[i]);
        }

        for (let asistente of asistentes) {
            console.log(asistente);
        }
