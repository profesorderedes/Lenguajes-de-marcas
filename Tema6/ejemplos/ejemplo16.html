<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 15</title>
</head>

<body>
    <h1>Eventos onmouseover y onmouseuot</h1>

    <img src="imgs/planetas/saturno.png" alt="Saturno">

    <script>
        'use strict'

        let imagen = document.querySelector('img');

        imagen.addEventListener('mouseover', function() {ponerBorde(this)});
        imagen.addEventListener('mouseout', quitarBorde);

        function ponerBorde(elemento) {
            elemento.style.border = '5px solid red';
        }

        function quitarBorde(elemento) {
            elemento.style.border = 'none';
        }

    </script>
</body>

</html>
