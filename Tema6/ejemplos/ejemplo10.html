<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 10</title>
    <style>
        .texto-resaltado {
            color: blue;
            background-color: yellow;
            font-size: 1.5rem;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <h1>Asignar una clase a un elemento con JavaScript</h1>

    <p class="texto">Se puede asignar una clase a un elemento mediante JavaScript.</p>

    <script>
        'use strict'

        document.querySelector('p.texto').classList.add('texto-resaltado');

        document.querySelector('p.texto').classList.remove('texto');

    </script>
</body>

</html>
