<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 6</title>
</head>

<body>
    <h1>Acceso al DOM</h1>

    <p class="texto">Podemos modificar un texto desde JavaScript.</p>

    <div class="texto">Otro texto con la clase 'texto'</div>

    <p>Un último texto.</p>

    <script>
        'use strict'

        let parrafos = document.getElementsByTagName('p');

        for(let parrafo of parrafos){
            parrafo.innerHTML = 'MODIFICADO POR JAVASCRIPT';
        }

    </script>
</body>

</html>
