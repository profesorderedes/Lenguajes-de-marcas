<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 11</title>
</head>

<body>
    <h1>Evento click</h1>

    <button onclick="mostrarMensaje()">Púlsame</button>

    <p class="mensaje"></p>

    <script>
        'use strict'

        function mostrarMensaje() {
            document.querySelector('p.mensaje').innerHTML = 'Has pulsado el botón';
            document.querySelector('button').innerHTML = 'Me has pulsado';
        }
    </script>
</body>

</html>
