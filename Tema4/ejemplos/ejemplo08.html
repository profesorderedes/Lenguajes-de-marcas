<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 8</title>
    <style>
        table {
            border: 1px solid black;
            border-collapse: collapse;
            background-color: rgba(246, 132, 90, 0.382);

        th,
        td {
            border: 1px solid black;
            text-align: center;
            width: 150px;
            padding: 6px;
        }

        .fin_de_semana {
            background-color: rgb(187, 244, 188);
        }
    </style>
</head>

        <tr>

            <td>ED</td>
            <td>LM</td>
            <td></td>
            <td>BD</td>

            <td class="fin_de_semana" rowspan="7">Estudiar</td>
        </tr>
        <tr>
            <td>SI</td>

            <td>LM</td>

        <tr>
            <td>PROG</td>

            <td>BD</td>

        <tr>
            <td>LM</td>
            <td>SI</td>
            <td>BD</td>

        </tr>

</html>
