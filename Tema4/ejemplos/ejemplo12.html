<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 12</title>
    <style>
        #comentarios {
            width: 400px;
            height: 300px;
        }

        fieldset {
            width: 450px;
        }
    </style>
</head>

<body>
    <h1>Formularios</h1>

    <form action="tramitar.php">

        <fieldset>
            <legend>Encuesta</legend>

            Elije tus paises favoritos:<br>
            <select name="pais" id="pais" size="3" multiple>
                <option value="espanya">España</option>
                <option value="francia">Francia</option>
                <option value="portugal">Portugal</option>
            </select><br><br>

            <label for="comentarios">Comentarios</label><br>
            <textarea name="comentarios" id="comentarios"></textarea><br>

            <label for="password">Contraseña</label><br>
            <input type="password" name="password" id="password"><br>

            <label for="password">Confirmar contraseña</label><br>
            <input type="password" name="password2" id="password2"><br>

            <label for="color_favorito">Elige tu color favorito</label><br>
            <input type="color" name="color_favorito" id="color_favorito"><br>

            <label for="nacimiento">Fecha de nacimiento</label><br>
            <input type="date" name="nacimiento" id="nacimiento"><br>

            <label for="correo">Cuenta de correo</label><br>
            <input type="email" name="correo" id="correo"><br>

            <br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar formulario">

        </fieldset>

    </form>
</body>

</html>
