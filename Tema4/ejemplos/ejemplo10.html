<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 10</title>
    <style>
        img{
            height: 300px;
        }

        .parrafo1{
            color: chocolate;
        }

        .parrafo2{
            background-color: orange ;
        }

        .foto{
            border: 1px solid green;
            width: 200px;
            padding: 5px;
            margin-top: 10px;
        }

        .rojo{
            color: red;
        }

        .grande{
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>Divs</h1>

    <div class="parrafo1">Este texto se encuentra dentro de un div</div>

    <div class="parrafo2">Este otro texto se encuentra en otro div</div>

    <div class="foto">
        <img src="imgs/arquitectura/ben-dumond-VedK8_UlmkY-unsplash.jpg" alt="Rascacielos">
        <p>Esto es el pie de foto.</p>
    </div>

    <p>
        En este párrafo usamos <span class="grande">span</span> para asignar <span class="rojo">estilos</span> a trozos de texto.
    </p>

</body>

</html>
