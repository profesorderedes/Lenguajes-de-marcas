<!DOCTYPE html>
<html lang="efectos">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo12</title>
    <style>
        .basica{
            text-shadow: 2px 2px;
        }

        .coloreada{
            text-shadow: 2px 2px blue;
        }

        .difuminada{
            text-shadow: 2px 2px 3px blue;
        }
    </style>
</head>

<body>
    <h1>Sombras en los textos</h1>

    <h2 class="basica">Sombra básica</h2>

    <h2 class="coloreada">Sombra con color</h2>

    <h2 class="difuminada">Sombra con color y difuminado</h2>

</body>

</html>
