<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 29</title>
    <style>
        .circulo {
            width: 50px;
            height: 50px;
            background-color: crimson;
            border-radius: 50%;
            position: sticky;
            top: 0;
        }

        img {
            display: block;
        }
    </style>
</head>

<body>
    <h1>Position: sticky</h1>

    <div class="circulo"></div>

    <img src="imgs/flores/azucena.jpg" alt="Azucena">
    <img src="imgs/flores/clavel.jpg" alt="Clavel">
    <img src="imgs/flores/geranio.jpg" alt="Geranio">
    <img src="imgs/flores/jazmin.webp" alt="Jazmín">
    <img src="imgs/flores/kalanchoe.jpg" alt="Kalanchoe">


</body>

</html>
