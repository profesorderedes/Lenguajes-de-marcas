<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo20</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        span{
            vertical-align: bottom;
        }

        .amarillo {
            color: gold;
        }

        .violeta {
            color: purple;
        }

        .rojo {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Iconos de Google</h1>

    <p><span class="material-symbols-outlined amarillo">sentiment_satisfied</span> Cara sonriente</p>
    <p><span class="material-symbols-outlined violeta">sentiment_sad</span> Cara triste</p>
    <p><span class="material-symbols-outlined rojo">sentiment_extremely_dissatisfied</span> Cara enfadada</p>
</body>

</html>
