<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 27b</title>
    <style>
        div {
            position: relative;
            margin-top: 100px;
            width: 70%;
            margin: auto;
        }

        img {
            width: 100%;
        }

        p {
            position: absolute;
            bottom: -5px;
            left: 10px;
        }
    </style>
</head>

<body>
    <h1>Aplicación de position: absolute</h1>

    <div>
        <img src="imgs/arte/Noctаmbulos - Edward Hopper.jpg" alt="Pintura Noctámbulos">
        <p>Noctámbulos, de Edward Hopper</p>
    </div>

</body>

</html>
