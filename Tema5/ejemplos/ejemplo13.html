<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo13</title>
    <style>
        .serif {
            font-family: 'Times New Roman', Times, serif;
        }

        .sans-serif {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .monospace {
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>

<body>
    <h1>Tipos de fuente</h1>

    <p class="serif">Fuente con serif (serif)</p>

    <p class="sans-serif">Fuente sin serifa (sans-serif)</p>

    <p class="monospace">Fuente monoespaciada (monospace)</p>

</body>

</html>
