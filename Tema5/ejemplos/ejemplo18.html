<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 18</title>
    <script src="https://kit.fontawesome.com/6a72ec52e2.js" crossorigin="anonymous"></script>
    <style>
        .fa-brands {
            font-size: 0.7rem;
            padding-right: 4px;
        }

        .fa-dropbox {
            color: #0683f1;
        }

        .fa-square-instagram {
            color: palevioletred;
        }

        .fa-google-drive{
            color: greenyellow;
        }
    </style>
</head>

<body>
    <h1>Iconos de Font Awesome</h1>

    <p><i class="fa-brands fa-dropbox"></i> Dropbox</p>
    <p><i class="fa-brands fa-square-instagram"></i> Instagram</p>
    <p><i class="fa-brands fa-google-drive"></i> Drive</p>
</body>

</html>
