<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 38</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        .contenedor {
            width: 800px;
            height: 500px;
            border: 1px solid crimson;
            position: relative;
        }

        h1 {
            border: 1px solid green;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <h1>Centrado vertical</h1>
    </div>



</body>

</html>
