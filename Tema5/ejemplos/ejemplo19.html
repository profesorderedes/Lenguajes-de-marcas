<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 19</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        .bi {
            font-size: 0.8rem;
        }

        .bi-cloud-fog {
            color: #4adee8;
        }

        .bi-cloud-lightning-rain {
            color: #114bdd;
        }

        .bi-sun {
            color: #f2c041;
        }
    </style>
</head>

<body>
    <h1>Iconos de Bootstrap</h1>

    <p><i class="bi bi-cloud-fog"></i> Niebla</p>
    <p><i class="bi bi-cloud-lightning-rain"></i> Tormenta</p>
    <p><i class="bi bi-sun"></i> Soleado</p>

</body>

</html>
