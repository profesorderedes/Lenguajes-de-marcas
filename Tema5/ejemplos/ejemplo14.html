<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 14</title>
    <style>
        .negrita{
            font-weight: bold;
        }

        .cursiva{
            font-style: italic;
        }

        .versalitas{
            font-variant: small-caps;
        }
    </style>
</head>

<body>
    <h1>Propiedades de fuente</h1>

    <p>Texto <span class="negrita">en negrita</span></p>

    <p>Texto <span class="cursiva">en cursiva</span></p>

    <p class="versalitas">Texto en Versalitas</p>

</body>

</html>
