<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 30</title>
    <style>
        img {
            width: 200px;
            position: absolute;
        }

        #foto1{
            left: 50px;
            z-index: 3;
        }

        #foto2{
            left: 100px;
            z-index: 2;
        }

        #foto3{
            left: 150px;
            z-index: 1;
        }
    </style>
</head>

<body>
    <h1>Propiedad z-index</h1>

    <img id="foto1" src="imgs/arquitectura/syaoran-7-ys4oRMAI3O4-unsplash.jpg" alt="Edificio">
    <img id="foto2" src="imgs/arquitectura/jorge-percival-QW32kgFye3c-unsplash.jpg" alt="Edificio">
    <img id="foto3" src="imgs/arquitectura/james-padolsey-tvPvROBv0F4-unsplash.jpg" alt="Edificio">

</body>

</html>
