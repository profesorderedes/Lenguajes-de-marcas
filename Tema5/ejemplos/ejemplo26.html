<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 26</title>
    <style>
        .contenedor {
            position: relative;
            border: 1px solid blue;
        }

        img {
            width: 250px;
        }

        .absoluta {
            position: absolute;
            bottom: 0;
            right: 0;
        }
    </style>
</head>

<body>
    <h1>Position: absolute respecto a un contenedor que también tenga position</h1>

    <div class="contenedor">
        <img class="absoluta" src="imgs/arquitectura/ben-dumond-VedK8_UlmkY-unsplash.jpg" alt="Edificio">
        <img src="imgs/arquitectura/dil-5OOfwgaiUN8-unsplash.jpg" alt="Edificio">
    </div>


</body>

</html>
