<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 11</title>
    <style>
        h1{
            /* text-transform: capitalize; */
            font-variant: small-caps;
        }

        a{
            text-decoration: none;
            color: salmon;
        }

        .resaltado{
            text-decoration-line: overline;
            text-decoration-style: dashed;
            text-decoration-color: crimson;
            text-decoration-thickness: 4px;
        }
    </style>
</head>

<body>
    <h1>Text decoration</h1>

    <p>Puedes visitar <a href="https://www.wikipedia.org">Wikipedia</a> para ampliar más sobre el tema.</p>

    <p>El <span class="resaltado">lenguaje HTML</span> permite crear la estructura de una página web. Y el CSS, su apariencia.</p>
</body>

</html>
