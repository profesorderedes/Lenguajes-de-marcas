<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejer 2</title>
    <style>
        p {
            font-size: 18px;
        }

        div{
            width: 250px;

        div.rectangulo1 {
            border: rgb(200, 200, 0) 3px solid;
            color: rgb(0, 0, 0);

        div.rectangulo2 {
            border: rgb(220, 0, 220) 3px solid;
            color: rgb(240, 240, 240);
            background-color: rgb(0, 180, 180);
        }

</head>

<body>
    <h1>Colores en Css</h1>
    <div class="rectangulo1">
        <p>Ahora probamos con colores definidos como RGB</p>
    </div><br>
    <div class="rectangulo2">
        <p>Ahora probamos con colores definidos como RGB</p>
    </div>
</body>
