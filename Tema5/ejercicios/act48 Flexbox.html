<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 48</title>

    <script src="https://kit.fontawesome.com/0fc2f8f7a9.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background-color: rgb(8, 1, 29);
        }

        #contenedor {
            width: 80%;
            margin: auto;
        }

        h1 {
            color: white;
            text-align: center;
            padding: 20px;
        }

        .menu {
            overflow: auto;
            border-top: 1px white solid;
            border-bottom: 1px white solid;
            font-family: sans-serif;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
        }


        #menu_izquierdo {
            color: white;
            display: flex;
            column-gap: 1.5rem;
        }

        #menu_izquierdo li {
            margin: 20px 20px 20px 0;
            list-style: none;
        }

        .menu li a {
            color: inherit;
            text-decoration: none;
        }

        #menu_izquierdo li:hover {
            text-decoration: underline;
        }

        #buscar {
            color: greenyellow;
        }

        li#buscar:hover {
            text-decoration: none;
        }


        #menu_derecho {
            color: greenyellow;
            display: flex;
        }

        #menu_derecho li {
            margin: 20px 0 20px 20px;
            list-style: none;

        }

        i {
            font-size: 22px;
        }
    </style>

</head>

<body>
    <div id="contenedor">

        <h1>Barra de menú de Xataka</h1>


        <div class="menu">

            <ul id="menu_izquierdo">
                <li id="buscar">
                    <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
                </li>
                <li><a href="#">ANÁLISIS</a></li>
                <li><a href="#">XATAKA SELECCIÓN</a></li>
                <li><a href="#">MÓVILES</a></li>
                <li><a href="#">CIENCIA</a></li>
                <li><a href="#">PRO</a></li>
                <li><a href="#">NEWSLETTER</a></li>
            </ul>

            <ul id="menu_derecho">
                <li><a href="#"><i class="fa-brands fa-twitter"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-youtube"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-flipboard"></i></a></li>
            </ul>
        </div>

    </div>
</body>

</html>
