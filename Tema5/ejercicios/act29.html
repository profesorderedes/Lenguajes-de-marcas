<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 29</title>

    <style>
        .enlace1 {
            text-decoration: none;
        }

        .enlace1:visited {
            color: teal;
        }

        .enlace1:hover {
            color: maroon;
            cursor: help;
        }

        .enlace1:active {
            background-color: rgb(95, 230, 95);
        }
    </style>

</head>

<body>
    <h1>Estilando links</h1>

    <p>Si quieres conocer cuál es el sentido de la vida, el universo y todo lo demás, haz <a
            href="https://es.wikipedia.org/wiki/Universo" class="enlace1">clic aquí</a></p>
</body>

</html>
