<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 39</title>

    <style>
        div {
            width: 100px;
            height: 100px;
            position: absolute;
        }

        #rectangulo-amarillo {
            background-color: yellow;
            top: 60px;
            left: 120px;
            z-index: 2;
        }

        #rectangulo-rojo {
            background-color: red;
            top: 140px;
            left: 85px;
        }

        #rectangulo-verde {
            background-color: green;
            z-index: 1;
            top: 120px;
            left: 170px;
        }

        #rectangulo-azul {
            background-color: blue;
            left: 140px;
        }
    </style>
</head>

<body>
    <h1>Prácticas con z-index</h1>
    <div id="rectangulo-amarillo"></div>
    <div id="rectangulo-rojo"></div>
    <div id="rectangulo-verde"></div>
    <div id="rectangulo-azul"></div>
</body>

</html>
