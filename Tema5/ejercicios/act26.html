<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejer 26</title>
    <script src="https://kit.fontawesome.com/7e3d226fea.js" crossorigin="anonymous"></script>
    <style>
        h1 {
            color: green;
        }

        ul {
            list-style: none;
            line-height: 30px;
        }

        .fa-solid {
            font-size: 1.4rem;
        }

        .fa-truck-medical {
            color: orange;
        }

        .fa-bus {
            color: brown;
        }

        .fa-car {

        }

        .fa-motorcycle {
            color: greenyellow;
        }

        .fa-truck {

        }

</head>

<body>

    <ul>
        <li>
            <i class="fa-solid fa-truck-medical"></i> Ambuláncia
        </li>
        <li>
            <i class="fa-solid fa-bus"></i> Autobús
        </li>
        <li>
            <i class="fa-solid fa-car"></i> Coche
        </li>
        <li>
            <i class="fa-solid fa-motorcycle"></i> Motocicleta
        </li>
        <li>

        </li>

</html>
