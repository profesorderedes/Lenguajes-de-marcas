<!DOCTYPE html>
<html lang="es">

<head>

    <title>Ejercicio 38</title>

    <style>
        h1 {
            margin-bottom: 20px;

        .letra {

            position: sticky;
            top: 0;
        }

        ul {
            margin-top: 5px;
            margin-bottom: 20px;
        }

<body>

    <div>

        <ul>
            <li>Bash</li>

            <li>C++</li>

            <li>COBOL</li>

    <div>
