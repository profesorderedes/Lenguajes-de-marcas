<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 01</title>

    <style>
        div {
            width: 250px;
            height: 150px;
            border: 3px solid;
        }

        .box1 {
            background-color: indianred;
            color: mistyrose;
            border-color: goldenrod;
        }

        .box2 {
            background-color: paleturquoise;
            color: olive;
            border-color: midnightblue;
        }

        p {
            font-size: 18px;
            margin: 0px;
        }
    </style>

</head>

<body>
    <h1>Colores en CSS</h1>
    <div class="box1">
        <p>Esto es un div para hacer pruebas con colores</p>
    </div>
    <br>
    <div class="box2">
        <p>Esto es otro div para hacer más pruebas</p>
    </div>

</body>

</html>
