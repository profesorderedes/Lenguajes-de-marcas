<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 47</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />

    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background-color: rgb(8, 1, 29);
        }

        #contenedor {
            width: 80%;
            margin: auto;
        }

        h1 {
            color: white;
            text-align: center;
            padding: 20px;
        }

        .menu {
            overflow: auto;
            border-top: 1px white solid;
            border-bottom: 1px white solid;
        }


        #menu_izquierdo {
            color: white;
        }

        #menu_izquierdo li {
            float: left;
            margin: 20px 20px 20px 0;
            list-style: none;
            line-height: 24px;
        }

        #menu_izquierdo li a {
            color: inherit;
            text-decoration: none;
        }

        #menu_izquierdo li:hover {
            text-decoration: underline;
        }

        #buscar {
            color: greenyellow;
        }

        li#buscar:hover {
            text-decoration: none;
        }
    </style>

</head>

<body>
    <div id="contenedor">

        <h1>Barra de menú de Xataka</h1>


        <div class="menu">
            <ul id="menu_izquierdo">
                <li id="buscar">
                    <a href="#">
                        <span class="material-symbols-outlined">search</span>
                    </a>
                </li>
                <li><a href="#">ANÁLISIS</a></li>
                <li><a href="#">XATAKA SELECCIÓN</a></li>
                <li><a href="#">MÓVILES</a></li>
                <li><a href="#">CIENCIA</a></li>
                <li><a href="#">PRO</a></li>
                <li><a href="#">NEWSLETTER</a></li>
            </ul>
        </div>

    </div>
</body>

</html>
