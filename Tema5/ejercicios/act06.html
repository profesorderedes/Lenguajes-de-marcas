<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejer 6</title>
    <style>
        h1 {
            color: rgb(252, 178, 42);
        }

        div {
            height: 100px;
            width: 100px;
        }

        .caja1 {
            background-color: rgba(152, 251, 152, 0);
        }

        .caja2 {
            background-color: rgba(152, 251, 152, 0.3);
        }

        .caja3 {
            background-color: rgba(152, 251, 152, 0.7);
        }

        .caja4 {
            background-color: rgba(152, 251, 152, 1);
        }
    </style>
</head>

<body>
    <h1>Pruebas con fondos y opacidad</h1>

    <div class="caja1">
        <p>Opacidad 0</p>
    </div>
    <div class="caja2">
        <p>Opacidad 0.3</p>
    </div>
    <div class="caja3">
        <p>Opacidad 0.7</p>
    </div>
    <div class="caja4">
        <p>Opacidad 1</p>
    </div>
</body>

</html>
